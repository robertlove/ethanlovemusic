<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{- site.title -}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>

    <header class="navbar navbar-translucent">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{- site.title -}}</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">
          <div class="drawer-header">
            <h2 class="drawer-title fs-md" id="navbarNavMenuLabel">{{- site.title -}}</h2>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              {% for item in site.data.nav %}
                <li class="nav-item">
                  <a class="nav-link" href="{{- item.url -}}" target="_blank">
                    <i class="bi bi-{{- item.title | downcase -}}"></i>
                    {{- item.title -}}
                  </a>
                </li>
              {% endfor %}
            </ul>
          </div>
        </dialog>
      </div>
    </header>

    {{ content }}

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
