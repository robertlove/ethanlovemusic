<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{- site.title -}}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="bg-black">

    <nav class="navbar navbar-expand-md bg-black bg-opacity-50 fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{- site.title -}}</a>
        <ul class="navbar-nav">
          <li class="nav-item d-none d-md-inline-block me-2">
            <a class="nav-link" href="https://www.youtube.com/@ethanlovemusic" target="_blank" aria-label="YouTube">
              <i class="bi bi-youtube"></i>
            </a>
          </li>
          <li class="nav-item d-none d-md-inline-block me-2">
            <a class="nav-link" href="#" target="_blank" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
          </li>
          <li class="nav-item d-none d-md-inline-block">
            <a class="nav-link" href="#contact" data-bs-toggle="modal" aria-label="Contact">
              <i class="bi bi-envelope"></i>
            </a>
          </li>
          <li class="nav-item d-inline-block d-md-none">
            <a class="nav-link" href="#navigation" data-bs-toggle="offcanvas" role="button" aria-controls="navigation" aria-label="Toggle Navigation">
              <i class="bi bi-list"></i>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <header class="cover">
      <div class="container">
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="navigation">
      <div class="navbar bg-black bg-opacity-50">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">{{- site.title -}}</a>
          <ul class="navbar-nav">
            <li class="nav-item d-inline-block d-md-none">
              <button class="nav-link" data-bs-dismiss="offcanvas" aria-label="Close">
                <i class="bi bi-x"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="https://www.youtube.com/@ethanlovemusic" target="_blank">
              <i class="bi bi-youtube me-2"></i>
              YouTube
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" target="_blank">
              <i class="bi bi-instagram me-2"></i>
              Instagram
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contact" data-bs-toggle="modal">
              <i class="bi bi-envelope me-2"></i>
              Contact
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="modal fade" id="contact" tabindex="-1" aria-labelledby="contact-label" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="contact-label">Contact</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" aria-describedby="email-help">
                <div id="email-help" class="form-text">We'll never share your email with anyone else.</div>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="3"></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="{{- '/assets/js/bootstrap.bundle.min.js' | relative_url -}}"></script>
  </body>
</html>
