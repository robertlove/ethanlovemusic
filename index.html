---
layout: default
---

<header class="cover">
    <div class="container py-5">
    <h1 class="visually-hidden">{{ site.title }}</h1>
    <p>{{ site.description | replace: ' ', '<br>' }}</p>
    </div>
</header>

<main>
  <div class="container">
    <h2 class="display-4 my-5 text-center">Latest Videos</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-xxl-3">
      {% for video in site.data.videos %}
        <div class="col">
          <div class="ratio ratio-16x9 mb-4">
            <iframe src="https://www.youtube.com/embed/{{- video.id -}}" title="{{- video.title | escape -}}" allowfullscreen=""></iframe>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</main>
